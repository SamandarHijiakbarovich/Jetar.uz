name: jetar

services:
  postgres:
    image: postgres:15-alpine
    container_name: jetar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jetar}
      POSTGRES_USER: ${POSTGRES_USER:-jetar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jetar}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jetar} -d ${POSTGRES_DB:-jetar}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jetar-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: jetar-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-jetar}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-jetar_minio_secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: src/Jetar.API/Dockerfile
    container_name: jetar-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Ikki pastki chiziq — ichma-ich joylashgan konfiguratsiya kaliti.
      JETAR_ConnectionStrings__Postgres: 'Host=postgres;Port=5432;Database=${POSTGRES_DB:-jetar};Username=${POSTGRES_USER:-jetar};Password=${POSTGRES_PASSWORD:-jetar}'
      JETAR_ConnectionStrings__Redis: 'redis:6379'
      JETAR_Jwt__Secret: ${JWT_SECRET:?JWT_SECRET .env faylida belgilanishi shart}
      # Prodda demo ma'lumot yuklamaymiz; migratsiyalar avtomatik qo'llanadi.
      JETAR_Database__Seed: ${DB_SEED:-false}
      JETAR_Database__AutoMigrate: ${DB_AUTOMIGRATE:-true}
      # Yangi model: to'lov o'chirilgan (platforma pulga aralashmaydi).
      JETAR_Platform__EscrowEnabled: ${ESCROW_ENABLED:-false}
      # Pullik ko'tarish (TOP) — karta rekvizitlari .env dan.
      JETAR_Platform__Boost__CardNumber: ${BOOST_CARD_NUMBER:-8600 0000 0000 0000}
      JETAR_Platform__Boost__CardHolder: ${BOOST_CARD_HOLDER:-JETAR}
      # Boshlang'ich admin akkaunti.
      JETAR_Admin__FirstName: ${ADMIN_FIRST_NAME:-Samandar}
      JETAR_Admin__LastName: ${ADMIN_LAST_NAME:-Mamasoatov}
      JETAR_Admin__Username: ${ADMIN_USERNAME:-samandar}
      JETAR_Admin__Phone: ${ADMIN_PHONE:-+998937650083}
      JETAR_Admin__Email: ${ADMIN_EMAIL:-samandar@jetar.uz}
      JETAR_Admin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD .env faylida belgilanishi shart}
      JETAR_Admin__ForcePassword: ${ADMIN_FORCE_PASSWORD:-false}
      JETAR_Platform__CommissionRate: ${COMMISSION_RATE:-0.08}
      JETAR_Platform__AutoReleaseHours: ${AUTO_RELEASE_HOURS:-72}
      JETAR_Payments__SandboxMode: ${PAYMENTS_SANDBOX:-true}
      JETAR_Payments__ProviderRedirect: ${PAYMENTS_PROVIDER_REDIRECT:-true}
      JETAR_Payments__ReturnUrl: ${PAYMENT_RETURN_URL:-http://localhost:5173/checkout/result}
      JETAR_Payments__Click__MerchantId: ${CLICK_MERCHANT_ID:-}
      JETAR_Payments__Click__SecretKey: ${CLICK_SECRET_KEY:-}
      JETAR_Payments__Payme__MerchantId: ${PAYME_MERCHANT_ID:-}
      JETAR_Payments__Payme__SecretKey: ${PAYME_SECRET_KEY:-}
      JETAR_Telegram__Enabled: ${TELEGRAM_ENABLED:-false}
      JETAR_Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      JETAR_Cors__AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:5173}
      JETAR_Cors__AllowedOrigins__1: http://localhost
    ports:
      - '${API_PORT:-5080}:8080'
    volumes:
      - uploads:/app/wwwroot/uploads

  web:
    build:
      context: ./frontend
      # Bo'sh => frontend nisbiy "/api" chaqiradi (nginx backendga uzatadi, bitta domen).
      args:
        VITE_API_URL: ${PUBLIC_API_URL-}
    container_name: jetar-web
    restart: unless-stopped
    depends_on:
      - api
    # Port ochilmaydi — tashqi trafik Caddy orqali (HTTPS) keladi.
    expose:
      - '80'

  # ── Caddy: avtomatik HTTPS (Let's Encrypt) ────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: jetar-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN .env faylida belgilanishi shart}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@jetar.uz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  redis-data:
  minio-data:
  uploads:
  caddy-data:
  caddy-config:
